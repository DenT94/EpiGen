[project]
name = "epigen"
version = "0.1.0"
description = "Protease-gated selective antibiotic design tool with agentic compensatory-mutation explanation."
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "biopython",
    "numpy",
    "pandas",
    "requests",
    "python-dotenv",
    # PyPI's latest release (1.6.5) predates the cartoon-style renderer (viewer-cartoon.min.js,
    # `style="cartoon"` on py2Dmol.view()) -- that's only on GitHub main as of this writing, not
    # yet cut into a release. Pull from source until a PyPI release catches up (same pattern
    # proto-tools already uses below).
    "py2Dmol @ git+https://github.com/sokrypton/py2Dmol.git",
    "proto-tools @ git+https://github.com/evo-design/proto-tools.git",
    "anthropic",
    "pydantic",
]

[tool.setuptools.packages.find]
include = ["epigen*"]
